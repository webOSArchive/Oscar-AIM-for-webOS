# TLS in front of the OSCAR server, for clients that can use it (webOS CE and Lunacy, once their
# AIM plugin is told to). Stock webOS devices can't: they keep using plain 5190.
# Include from the top level of nginx.conf (not inside http {}):  include /etc/nginx/oscar-stream.conf;
# Needs nginx's stream module (Ubuntu: libnginx-mod-stream).
stream {
    upstream oscard {
        server 127.0.0.1:5190;
    }
    server {
        listen 5191 ssl;
        ssl_certificate     /etc/letsencrypt/live/oscar.webosarchive.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oscar.webosarchive.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass oscard;
        proxy_timeout 10m;
    }
}
