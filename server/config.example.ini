; webOS Chat OSCAR server. Copy to config.ini. Every key can also come from the
; environment as OSCAR_<KEY> (OSCAR_ADVERTISE, OSCAR_DEBUG, ...).

; Where to listen, comma-separated.
listen = "0.0.0.0:5190"

; host:port given to clients for their second (BOS) connection. Must resolve and be
; reachable from devices; only the first login host is redirected on stock webOS.
advertise = "oscar.webosarchive.org:5190"

; file: accounts.json in data_dir (development and test accounts). pdo: the App Museum's
; accounts table (username + webOS Chat pass phrase). Several are asked in order: "file,pdo".
accounts = file
;db_dsn = "mysql:host=localhost;dbname=museum;charset=utf8mb4"
;db_user = "oscar"
;db_pass = "..."

; Buddy lists and offline messages.
data_dir = "data"

debug = false
