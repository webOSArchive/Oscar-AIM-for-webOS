; webOS Chat OSCAR server. Copy to config.ini. Every key can also come from the
; environment as OSCAR_<KEY> (OSCAR_ADVERTISE, OSCAR_LOG_LEVEL, ...).

; Where to listen, comma-separated.
listen = "0.0.0.0:5190"

; host:port given to clients for their second (BOS) connection. Must resolve and be
; reachable from devices; only the first login host is redirected on stock webOS.
advertise = "oscar.webosarchive.org:5190"

; file: accounts.json in data_dir (development and test accounts). pdo: the App Museum's
; accounts table (username + webOS Chat pass phrase). Several are asked in order: "file,pdo".
accounts = file
;db_dsn = "mysql:host=localhost;dbname=museum;charset=utf8mb4"
;db_user = "oscar"
;db_pass = "..."

; Buddy lists and offline messages.
data_dir = "data"

; Limits. Offline messages are kept only for real accounts: offline_max per user, each
; for offline_days. max_conns stays under 1000 (PHP's stream_select can't watch more);
; max_per_ip is per address, so a household or carrier NAT shares it; signon_timeout is
; the seconds a connection has to sign in. max_sessions is how many places one screen name
; can be signed on at once; a sign-in past it signs the oldest off (1: one place only).
; idle_timeout is the seconds a client may send nothing before it is dropped (webOS devices
; can be quiet for minutes while awake); keepalive is the seconds of quiet before the server
; sends one, so a connection that has died is found by TCP and its NAT mapping stays open.
; delivery_timeout is the seconds a device's TCP has to acknowledge what was sent before its
; connection is given up; messages sent to a connection in that time before it went are
; delivered again at its next sign-on, so none is lost (it needs PHP's sockets extension).
; Messages to an account that is offline are always kept (offline_max, offline_days).
;offline_max = 100
;offline_days = 30
;max_conns = 900
;max_per_ip = 16
;signon_timeout = 30
;max_sessions = 4
;idle_timeout = 1800
;keepalive = 60
;delivery_timeout = 60

; Everyone a buddy of everyone: a screen name's first sign-on adds it to the buddy list of each
; name that has signed on before, and each of them to its own (data_dir/roster.json keeps who
; has). Once only, so someone taken off a list stays off.
auto_buddies = on

; How much goes to the journal: normal (connections, sign-ins, refusals, limits), verbose (and
; each session's buddy list changes, messages with sender, recipient, size and outcome, away,
; idle and lookups; never message text) or debug (and every SNAC in and out).
log_level = normal
